<div class="manage-dest-modal">
  <div class="mdm-header">
    <div>
      <h3>Manage destinations</h3>
      <p class="mdm-subtitle">{{ tripDateRange }}</p>
    </div>
    <button class="mdm-close" (click)="close()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Timeline bar -->
  <div class="mdm-timeline-bar" *ngIf="totalDays > 0">
    <div class="mdm-bar-segment" *ngFor="let dest of destinations; let i = index"
         [style.width.%]="getBarWidth(dest)"
         [style.background]="getColor(i)">
    </div>
  </div>

  <!-- Destination list -->
  <div class="mdm-dest-list">
    <div class="mdm-dest-card" *ngFor="let dest of destinations; let i = index">
      <div class="mdm-dest-drag">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#999">
          <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
          <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
          <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
        </svg>
      </div>
      <div class="mdm-dest-dot" [style.background]="getColor(i)"></div>
      <div class="mdm-dest-info">
        <strong>{{ dest.name }}</strong>
        <span class="mdm-dest-dates">
          {{ getDateLabel(dest.startDate) }} – {{ getDateLabel(dest.endDate) }} · {{ getNightsLabel(dest) }}
        </span>
      </div>
      <button class="mdm-dest-action mdm-dest-edit" (click)="editDest(i)" title="Edit dates">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <button class="mdm-dest-action mdm-dest-delete" (click)="deleteDest(i)" *ngIf="i > 0" title="Delete">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Add destination -->
  <button class="mdm-add-btn" (click)="addDest()">+ Add destination</button>
</div>
