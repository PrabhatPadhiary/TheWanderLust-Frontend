<div class="add-to-trip-modal">
  <!-- Header -->
  <div class="att-header">
    <div class="att-header-title">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2B3F51" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="12" y1="14" x2="12" y2="18"/>
        <line x1="10" y1="16" x2="14" y2="16"/>
      </svg>
      <span>Add to a trip</span>
    </div>
    <button class="att-close" (click)="cancel()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Place preview -->
  <div class="att-place-preview">
    <div class="att-place-thumb">
      <img *ngIf="data.place.photos.length" [src]="data.place.photos[0].url" [alt]="data.place.name">
      <div *ngIf="!data.place.photos.length" class="att-place-thumb-placeholder">📍</div>
    </div>
    <div class="att-place-info">
      <strong>{{ data.place.name }}</strong>
      <span>{{ data.category | titlecase }} · {{ data.destinationName }}
        <span *ngIf="data.place.rating"> · <svg viewBox="0 0 24 24" width="10" height="10" fill="#E64A1A" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> {{ data.place.rating }}</span>
      </span>
    </div>
  </div>

  <div class="att-divider"></div>

  <!-- Trip list -->
  <div class="att-body">
    <p class="att-section-label">Choose trip</p>

    <div class="att-loading" *ngIf="tripsLoading">
      <div class="att-spinner"></div>
    </div>

    <div class="att-trips" *ngIf="!tripsLoading">
      <button
        class="att-trip-row"
        *ngFor="let trip of allTrips"
        [class.att-trip-row--active]="selectedTripId === trip.id"
        [class.att-trip-row--disabled]="isTripDisabled(trip.id)"
        [disabled]="isTripDisabled(trip.id)"
        (click)="selectTrip(trip)">
        <span class="att-trip-dot" [class.att-trip-dot--active]="selectedTripId === trip.id"></span>
        <span class="att-trip-name">{{ trip.name }}</span>
        <span class="att-trip-near" *ngIf="isNearby(trip.id) && !isTripDisabled(trip.id)">Nearby</span>
        <span class="att-trip-added" *ngIf="isTripDisabled(trip.id)">Added</span>
        <span class="att-trip-dates" *ngIf="(trip.startDate || trip.endDate) && !isTripDisabled(trip.id)">
          {{ trip.startDate | date:'MMM d' }}<span *ngIf="trip.endDate"> – {{ trip.endDate | date:'MMM d' }}</span>
        </span>
      </button>

      <button class="att-trip-row att-trip-row--create" (click)="createNewTrip()">
        <span class="att-create-icon">+</span>
        <span>Create new trip</span>
      </button>
    </div>

    <div class="att-loading" *ngIf="destsLoading">
      <div class="att-spinner"></div>
    </div>

    <!-- Far from every stop on this trip: ask where the place belongs. -->
    <div class="att-far" *ngIf="far && !destsLoading">
      <p class="att-far-text">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        <span>{{ data.place.name }}<ng-container *ngIf="farCity"> is in {{ farCity.name }},</ng-container><ng-container *ngIf="!farCity"> is</ng-container> about {{ formatFarKm(far.km) }} from {{ far.nearName }}.</span>
      </p>

      <div class="att-loading" *ngIf="far.city === undefined"><div class="att-spinner"></div></div>

      <div class="att-trips" *ngIf="far.city !== undefined" role="radiogroup" aria-label="Where should this place go?">
        <button *ngIf="farCity" class="att-trip-row att-far-option" role="radio"
          [attr.aria-checked]="farChoice === 'stop'"
          [class.att-trip-row--active]="farChoice === 'stop'" (click)="farChoice = 'stop'">
          <span class="att-trip-dot" [class.att-trip-dot--active]="farChoice === 'stop'"></span>
          <span class="att-trip-name">
            Add {{ farCity.name }} as a new stop
            <small>Saves it under {{ farCity.name }} on {{ getSelectedTrip()?.name }}</small>
          </span>
        </button>
        <button class="att-trip-row att-far-option" role="radio"
          [attr.aria-checked]="farChoice === 'new'"
          [class.att-trip-row--active]="farChoice === 'new'" (click)="farChoice = 'new'">
          <span class="att-trip-dot" [class.att-trip-dot--active]="farChoice === 'new'"></span>
          <span class="att-trip-name">Start a new trip<ng-container *ngIf="farCity"> to {{ farCity.name }}</ng-container></span>
        </button>
        <button class="att-trip-row att-far-option" role="radio"
          [attr.aria-checked]="farChoice === 'anyway'"
          [class.att-trip-row--active]="farChoice === 'anyway'" (click)="farChoice = 'anyway'">
          <span class="att-trip-dot" [class.att-trip-dot--active]="farChoice === 'anyway'"></span>
          <span class="att-trip-name">Add to {{ anywayName }} anyway</span>
        </button>
      </div>
    </div>

    <!-- Destination picker -->
    <ng-container *ngIf="selectedTripId && !destsLoading && selectedTripDestinations.length > 1 && showStopPicker">
      <div class="att-divider"></div>
      <p class="att-section-label" style="text-transform: none; margin-top: 16px;">Choose destination</p>
      <div class="att-dest-pills">
        <button
          class="att-dest-pill"
          *ngFor="let dest of selectedTripDestinations; let i = index"
          [class.att-dest-pill--active]="selectedDestinationIndex === i"
          (click)="selectedDestinationIndex = i">
          {{ dest.name }}
        </button>
      </div>
    </ng-container>
  </div>

  <div class="att-divider"></div>

  <!-- Footer -->
  <div class="att-footer">
    <button class="att-cancel" (click)="cancel()">Cancel</button>
    <button class="att-confirm"
      [disabled]="!canConfirm"
      (click)="confirm()">
      {{ confirmLabel }}
    </button>
  </div>
</div>
